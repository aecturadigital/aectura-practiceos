<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" fill="none">
  <!-- Concept F: Subtle 'A' + Architecture (The Keystone Apex Portal) -->
  <!-- Monolithic architectural archway with a floating suspended keystone core -->
  
  <!-- Left Incline Pylon -->
  <polygon points="20,86 32,86 44,24 32,24" fill="currentColor" />
  
  <!-- Right Incline Pylon -->
  <polygon points="68,86 80,86 68,24 56,24" fill="currentColor" />
  
  <!-- Top Horizontal Lintel (Bridge) -->
  <rect x="28" y="16" width="44" height="11" rx="2" fill="currentColor" />
  
  <!-- Central Floating Keystone / Structural Hub (Subtle A-bar & Core in Teal) -->
  <polygon points="50,40 60,56 40,56" fill="#0D9488" />
  
  <!-- Lower Structural Horizontal Stabilizer -->
  <rect x="37" y="62" width="26" height="5" rx="1.5" fill="#0D9488" opacity="0.8" />
</svg>
