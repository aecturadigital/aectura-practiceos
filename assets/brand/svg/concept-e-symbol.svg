<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" fill="none">
  <!-- Concept E: Intelligent Routing (The Orthogonal Vector Router) -->
  <!-- Clean grid-aligned architectural pathways with chamfered routing corners -->
  <!-- Primary Vertical Inbound Trunk -->
  <rect x="18" y="16" width="12" height="68" rx="3" fill="currentColor" opacity="0.9" />
  
  <!-- Horizontal Upper Routing Bus -->
  <path d="M30 26 H62 C70 26 76 32 76 40 V46" 
        stroke="currentColor" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
        
  <!-- Diagonal/Secondary Lower Routing Bus (Teal accent) -->
  <path d="M30 74 H54 C66 74 76 64 76 52" 
        stroke="#0D9488" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
        
  <!-- Inter-Route Convergence Core Node -->
  <circle cx="76" cy="49" r="6" fill="#0D9488" />
  <circle cx="24" cy="50" r="3.5" fill="#FFFFFF" />
</svg>
